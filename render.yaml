services:
  - type: web
    name: ennoic
    runtime: python
    plan: free
    branch: vibecoded
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 240 app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENNOIC_SECRET_KEY
        generateValue: true
      - key: ENNOIC_COOKIE_SECURE
        value: "true"
      - key: ENNOIC_TRUST_PROXY
        value: "true"
