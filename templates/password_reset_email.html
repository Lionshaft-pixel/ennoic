<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>Reset your Ennoic password</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f9f9f9;font-family:Arial,Helvetica,sans-serif;color:#161a39;-webkit-text-size-adjust:100%;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f9f9f9;">
      <tr>
        <td align="center" style="padding:28px 12px;">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;">
            <tr>
              <td align="center" style="padding:18px 20px 10px;">
                <img src="cid:ennoic-logo" width="240" alt="Ennoic" style="display:block;width:100%;max-width:240px;height:auto;border:0;">
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:30px 20px;background-color:#161a39;">
                <h1 style="margin:0;color:#ffffff;font-size:28px;font-weight:400;line-height:1.4;">Please reset your password</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:38px 40px 18px;color:#666666;font-size:17px;line-height:1.6;">
                <p style="margin:0 0 16px;">Hello,</p>
                <p style="margin:0 0 16px;">We received a request to reset your Ennoic account password.</p>
                <p style="margin:0;">Use the button below to choose a new password. This link expires in 30 minutes.</p>
              </td>
            </tr>
            <tr>
              <td align="left" style="padding:8px 40px 18px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#18163a" style="background-color:#18163a;border-radius:2px;">
                      <a href="{{ reset_url }}" target="_blank" style="display:inline-block;padding:15px 32px;color:#ffffff;font-size:17px;line-height:1.2;text-decoration:none;">Reset Password</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 40px 38px;color:#888888;font-size:14px;line-height:1.6;">
                <p style="margin:0;"><em>If you did not request a password reset, you can ignore this email.</em></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
